name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Every run step executes inside the devenv shell, with its git hooks off:
    # devenv runs them on each shell entry, which only costs time here.
    defaults:
      run:
        shell: devenv -O git-hooks.enable:bool false shell bash -e {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Install devenv
        shell: bash
        run: nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Cache Mix and npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('mix.lock', 'package-lock.json') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Get dependencies
        run: mix deps.get && npm ci

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Elixir tests
        run: mix test

      - name: Check the hook
        run: npm run check

      - name: Check the committed bundle matches its source
        run: npm run build && git diff --exit-code priv/static

      - name: Build docs
        run: mix docs --warnings-as-errors

      - name: Run full checks
        if: github.event_name == 'pull_request'
        run: mix check
